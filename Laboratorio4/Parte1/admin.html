<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPlay · Administración</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

<nav class="navbar-nova">
  <a href="../../index.html" class="navbar-marca">
    <img src="../../imgs/novaplay-logo-transparente.png" alt="" class="navbar-icono">
    <span>NovaPlay</span>
  </a>
  <ul class="navbar-enlaces">
    <li><a href="inicio.html">Inicio</a></li>
    <li><a href="catalogo.html">Catálogo</a></li>
    <li><a href="admin.html" class="activo">Administración</a></li>
  </ul>
</nav>

<main class="pagina">
  <h1>Administración</h1>
  <p class="subtitulo">Crea, edita y elimina títulos del catálogo de NovaPlay.</p>

  <div class="panel-admin">

    <section class="tarjeta-formulario">
      <h2 id="tituloFormulario">Nuevo título</h2>

      <div class="campo">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" placeholder="Ej: Stranger Things">
      </div>

      <div class="campo">
        <label for="genero">Género</label>
        <select id="genero">
          <option value="" disabled selected>Selecciona un género</option>
          <option value="Acción">Acción</option>
          <option value="Comedia">Comedia</option>
          <option value="Drama">Drama</option>
          <option value="Documental">Documental</option>
          <option value="Anime">Anime</option>
          <option value="Terror">Terror</option>
        </select>
      </div>

      <div class="campo">
        <label for="duracion">Duración (minutos)</label>
        <input type="number" id="duracion" min="1" placeholder="Ej: 120">
      </div>

      <div class="campo">
        <label for="fecha">Fecha de estreno</label>
        <input type="date" id="fecha">
      </div>

      <div class="campo campo-checkbox">
        <label for="disponible">
          <input type="checkbox" id="disponible">
          Disponible en catálogo
        </label>
      </div>

      <div class="botones">
        <button type="button" id="btnGuardar">Guardar</button>
        <button type="button" id="btnCancelar" class="boton-secundario">Cancelar</button>
      </div>
    </section>

    <section class="tarjeta-tabla">
      <div class="filtros">
        <input type="text" id="buscarTitulo" placeholder="Buscar por título...">
        <select id="filtroGenero">
          <option value="">Todos los géneros</option>
          <option value="Acción">Acción</option>
          <option value="Comedia">Comedia</option>
          <option value="Drama">Drama</option>
          <option value="Documental">Documental</option>
          <option value="Anime">Anime</option>
          <option value="Terror">Terror</option>
        </select>
      </div>

      <p class="contador" id="contadorResultados">Mostrando 0 resultados</p>

      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Género</th>
              <th>Duración</th>
              <th>Fecha</th>
              <th>Disponible</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div>
    </section>

  </div>
</main>

<div id="modal" class="modal-propio oculto">
  <div class="modal-contenido">
    <button type="button" id="btnCerrarModal" class="modal-cerrar">&times;</button>
    <div id="modalCuerpo"></div>
  </div>
</div>

<footer class="pie">
  <p>NovaPlay. Tu catálogo de series y películas, siempre a mano.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
<script src="datos.js"></script>
<script src="admin.js"></script>
</body>
</html>
