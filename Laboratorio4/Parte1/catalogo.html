<main class="pagina">
  <h1>Catálogo NovaPlay</h1>
  <p class="subtitulo">
    Explora, busca y filtra tu catálogo de series y películas. Haz clic en cualquier
    título para ver su ficha completa.
  </p>

  <div class="filtros">
    <input type="text" id="buscarTitulo" placeholder="Buscar por título...">
    <select id="filtroGenero">
      <option value="">Todos los géneros</option>
      <option value="Acción">Acción</option>
      <option value="Comedia">Comedia</option>
      <option value="Drama">Drama</option>
      <option value="Documental">Documental</option>
      <option value="Anime">Anime</option>
      <option value="Terror">Terror</option>
    </select>
  </div>

  <p class="contador" id="contadorResultados">Mostrando 0 resultados</p>

  <div class="grilla-tarjetas" id="grillaTarjetas"></div>
</main>

<footer class="pie">
  <p>NovaPlay. Tu catálogo de series y películas, siempre a mano.</p>
</footer>
