<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NovaPlay · Catálogo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
      <img src="../../imgs/novaplay-logo-transparente.png" alt="" class="navbar-icono">
      NovaPlay
    </a>
    <button class="navbar-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
      aria-controls="navMenu" aria-expanded="false" aria-label="Alternar navegación">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html">Administración</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <h1 class="text-center text-md-start">Catálogo NovaPlay</h1>
  <p class="texto-tenue text-center text-md-start">
    Explora, busca y filtra tu catálogo de series y películas. Haz clic en cualquier
    título para ver su ficha completa.
  </p>

  <div class="row g-2 mb-2">
    <div class="col-12 col-md-8">
      <input type="text" id="buscarTitulo" class="form-control" placeholder="Buscar por título...">
    </div>
    <div class="col-12 col-md-4">
      <select id="filtroGenero" class="form-select">
        <option value="">Todos los géneros</option>
        <option value="Acción">Acción</option>
        <option value="Comedia">Comedia</option>
        <option value="Drama">Drama</option>
        <option value="Documental">Documental</option>
        <option value="Anime">Anime</option>
        <option value="Terror">Terror</option>
      </select>
    </div>
  </div>

  <p class="texto-tenue small" id="contadorResultados">Mostrando 0 resultados</p>

  <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="grillaTarjetas"></div>
</main>

<footer class="pie text-center py-4">
  <p class="mb-0">NovaPlay. Tu catálogo de series y películas, siempre a mano.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
<script src="datos.js"></script>
<script src="catalogo.js"></script>
</body>
</html>
